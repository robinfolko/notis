name: Bevaka dubbelpass

on:
  schedule:
    - cron: "*/5 * * * *"   # var 5:e minut (GitHub kan fördröja körningar)
  workflow_dispatch:         # gör det möjligt att köra manuellt

permissions:
  contents: write            # behövs för att spara seen.json i repot

concurrency:
  group: bevaka
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Kör bevakning
        run: python bevaka_dubbelpass.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BOOKING_URL: ${{ vars.BOOKING_URL }}

      - name: Spara läget
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Uppdatera läge" && git push)
